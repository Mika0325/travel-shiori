<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f09199">

    <meta name="description" content="共有された旅のしおりを確認できます">

    <title>共有されたしおり｜旅のしおり</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================================
         ヘッダー
         ========================================= -->

    <header class="app-header">

        <h1>旅のしおり</h1>

        <p>
            共有された旅のしおり
        </p>

    </header>


    <!-- =========================================
         メイン
         ========================================= -->

    <main class="main-content">


        <!-- =====================================
             読み込み中
             ===================================== -->

        <section id="share-loading" class="content-section">

            <div class="share-message">

                <p>
                    旅のしおりを読み込んでいます…
                </p>

            </div>

        </section>


        <!-- =====================================
             エラー
             ===================================== -->

        <section id="share-error" class="content-section" style="display: none;">

            <div class="share-message error-message">

                <h2>
                    しおりを表示できません
                </h2>

                <p>
                    共有URLが正しくないか、
                    共有データが見つかりません。
                </p>

                <a href="index.html" class="primary-button">
                    ホームへ戻る
                </a>

            </div>

        </section>


        <!-- =====================================
             共有された旅行
             ===================================== -->

        <div id="shared-trip-content" style="display: none;">


            <!-- =================================
                 旅行情報
                 ================================= -->

            <section class="content-section">

                <div class="shared-trip-header">

                    <p id="shared-destination" class="shared-destination">
                    </p>


                    <h2 id="shared-title" class="shared-trip-title">
                    </h2>


                    <p id="shared-date" class="shared-trip-date">
                    </p>

                </div>

            </section>


            <!-- =================================
                 日程
                 ================================= -->

            <section class="content-section">

                <div class="section-title">

                    <h2>旅の日程</h2>

                </div>


                <div id="shared-schedule-list" class="shared-schedule-list">
                    <!-- 日程をここに表示 -->
                </div>

            </section>


            <!-- =================================
                 予算
                 ================================= -->

            <section class="content-section">

                <div class="section-title">

                    <h2>旅行の予算</h2>

                </div>


                <div id="shared-budget-list" class="shared-budget-list">
                    <!-- 予算をここに表示 -->
                </div>


                <div id="shared-budget-total" class="shared-budget-total">
                    <!-- 合計金額 -->
                </div>

            </section>


            <!-- =================================
                 メモ
                 ================================= -->

            <section id="shared-memo-section" class="content-section" style="display: none;">

                <div class="section-title">

                    <h2>メモ</h2>

                </div>


                <div id="shared-memo" class="shared-memo">
                </div>

            </section>


            <!-- =================================
                 共有について
                 ================================= -->

            <section class="content-section">

                <div class="share-info-card">

                    <h2>
                        共有されたしおり
                    </h2>

                    <p>
                        このページは共有された
                        旅のしおりです。
                    </p>

                    <p>
                        このページから内容を
                        編集することはできません。
                    </p>

                </div>

            </section>


        </div>


    </main>


    <!-- =========================================
         フッター
         ========================================= -->

    <footer class="app-footer">

        <p>
            旅のしおり
        </p>

        <a href="index.html">
            自分の旅のしおりを作る
        </a>

    </footer>


    <!-- =========================================
         JavaScript
         ========================================= -->

    <script>

        /* =========================================
         * 共有データ取得
         * ========================================= */

        function getSharedTrip() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const encodedData =
                params.get("data");


            if (!encodedData) {
                return null;
            }


            try {

                const base64 =
                    encodedData
                        .replace(/-/g, "+")
                        .replace(/_/g, "/");


                const padding =
                    "=".repeat(
                        (4 - base64.length % 4) % 4
                    );


                const binary =
                    atob(
                        base64 + padding
                    );


                const bytes =
                    Uint8Array.from(
                        binary,
                        function (character) {

                            return character.charCodeAt(0);

                        }
                    );


                const json =
                    new TextDecoder().decode(
                        bytes
                    );


                return JSON.parse(json);

            } catch (error) {

                console.error(
                    "共有データの読み込みに失敗しました。",
                    error
                );

                return null;
            }
        }


        /* =========================================
         * HTMLエスケープ
         * ========================================= */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =========================================
         * 日付表示
         * ========================================= */

        function formatDate(dateString) {

            if (!dateString) {
                return "";
            }


            const date =
                new Date(
                    dateString + "T00:00:00"
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return dateString;
            }


            return (
                date.getFullYear() +
                "年" +
                (date.getMonth() + 1) +
                "月" +
                date.getDate() +
                "日"
            );
        }


        /* =========================================
         * 日付範囲
         * ========================================= */

        function formatDateRange(
            startDate,
            endDate
        ) {

            if (
                !startDate &&
                !endDate
            ) {
                return "";
            }


            if (
                !endDate ||
                startDate === endDate
            ) {

                return formatDate(
                    startDate
                );
            }


            return (
                formatDate(startDate) +
                " ～ " +
                formatDate(endDate)
            );
        }


        /* =========================================
         * 金額表示
         * ========================================= */

        function formatMoney(amount) {

            return Number(
                amount || 0
            ).toLocaleString("ja-JP");
        }


        /* =========================================
         * 日程の種類
         * ========================================= */

        const scheduleTypes = {

            "出発": "🚩 出発",

            "移動": "🚃 移動",

            "観光": "📍 観光",

            "食事": "🍴 食事",

            "ホテル": "🏨 ホテル",

            "その他": "📌 その他"

        };


        /* =========================================
         * 日程表示
         * ========================================= */

        function displaySchedules(
            schedules
        ) {

            const list =
                document.getElementById(
                    "shared-schedule-list"
                );


            if (!list) {
                return;
            }


            list.innerHTML = "";


            if (
                !Array.isArray(schedules) ||
                schedules.length === 0
            ) {

                list.innerHTML = `
                    <p class="empty-message">
                        登録されている日程はありません。
                    </p>
                `;

                return;
            }


            schedules.forEach(
                function (schedule, index) {

                    const scheduleCard =
                        document.createElement(
                            "div"
                        );


                    scheduleCard.className =
                        "shared-schedule-card";


                    const typeLabel =
                        scheduleTypes[
                        schedule.type
                        ] ||
                        "📌 その他";


                    scheduleCard.innerHTML = `

                        <div class="shared-schedule-number">

                            ${index + 1}

                        </div>


                        <div class="shared-schedule-content">

                            <div class="shared-schedule-top">

                                <span class="shared-schedule-type">

                                    ${escapeHTML(
                        typeLabel
                    )}

                                </span>


                                ${schedule.time
                            ? `
                                            <span class="shared-schedule-time">
                                                ${escapeHTML(
                                schedule.time
                            )}
                                            </span>
                                        `
                            : ""
                        }

                            </div>


                            ${schedule.place
                            ? `
                                        <h3>
                                            ${escapeHTML(
                                schedule.place
                            )}
                                        </h3>
                                    `
                            : ""
                        }


                            ${schedule.detail
                            ? `
                                        <p>
                                            ${escapeHTML(
                                schedule.detail
                            )}
                                        </p>
                                    `
                            : ""
                        }


                            ${schedule.memo
                            ? `
                                        <p class="shared-schedule-memo">
                                            メモ：
                                            ${escapeHTML(
                                schedule.memo
                            )}
                                        </p>
                                    `
                            : ""
                        }

                        </div>

                    `;


                    list.appendChild(
                        scheduleCard
                    );

                }
            );
        }


        /* =========================================
         * 予算表示
         * ========================================= */

        function displayBudgets(
            budgets
        ) {

            const list =
                document.getElementById(
                    "shared-budget-list"
                );


            const totalElement =
                document.getElementById(
                    "shared-budget-total"
                );


            if (!list) {
                return;
            }


            list.innerHTML = "";


            if (
                !Array.isArray(budgets) ||
                budgets.length === 0
            ) {

                list.innerHTML = `
                    <p class="empty-message">
                        登録されている予算はありません。
                    </p>
                `;


                if (totalElement) {

                    totalElement.textContent =
                        "";
                }

                return;
            }


            let total = 0;


            budgets.forEach(
                function (budget) {

                    const amount =
                        Number(
                            budget.amount
                        ) || 0;


                    total += amount;


                    const budgetItem =
                        document.createElement(
                            "div"
                        );


                    budgetItem.className =
                        "shared-budget-item";


                    budgetItem.innerHTML = `

                        <span>

                            ${escapeHTML(
                        budget.category ||
                        budget.name ||
                        "その他"
                    )}

                        </span>


                        <strong>

                            ${formatMoney(
                        amount
                    )}円

                        </strong>

                    `;


                    list.appendChild(
                        budgetItem
                    );

                }
            );


            if (totalElement) {

                totalElement.innerHTML = `

                    <span>
                        合計
                    </span>

                    <strong>
                        ${formatMoney(total)}円
                    </strong>

                `;
            }
        }


        /* =========================================
         * 共有旅行表示
         * ========================================= */

        function displaySharedTrip(trip) {

            const loading =
                document.getElementById(
                    "share-loading"
                );


            const error =
                document.getElementById(
                    "share-error"
                );


            const content =
                document.getElementById(
                    "shared-trip-content"
                );


            if (!trip) {

                if (loading) {
                    loading.style.display =
                        "none";
                }

                if (error) {
                    error.style.display =
                        "block";
                }

                return;
            }


            if (loading) {
                loading.style.display =
                    "none";
            }


            if (error) {
                error.style.display =
                    "none";
            }


            if (content) {
                content.style.display =
                    "block";
            }


            /* -----------------------------------------
             * 旅行タイトル
             * ----------------------------------------- */

            const title =
                document.getElementById(
                    "shared-title"
                );


            if (title) {

                title.textContent =
                    trip.title || "無題の旅";
            }


            /* -----------------------------------------
             * 旅行先
             * ----------------------------------------- */

            const destination =
                document.getElementById(
                    "shared-destination"
                );


            if (destination) {

                destination.textContent =
                    trip.destination || "";
            }


            /* -----------------------------------------
             * 日程
             * ----------------------------------------- */

            const date =
                document.getElementById(
                    "shared-date"
                );


            if (date) {

                date.textContent =
                    formatDateRange(
                        trip.startDate,
                        trip.endDate
                    );
            }


            /* -----------------------------------------
             * 旅の日程
             * ----------------------------------------- */

            displaySchedules(
                trip.schedules || []
            );


            /* -----------------------------------------
             * 予算
             * ----------------------------------------- */

            displayBudgets(
                trip.budgets || []
            );


            /* -----------------------------------------
             * メモ
             * ----------------------------------------- */

            const memoSection =
                document.getElementById(
                    "shared-memo-section"
                );


            const memo =
                document.getElementById(
                    "shared-memo"
                );


            if (
                trip.memo &&
                memoSection &&
                memo
            ) {

                memoSection.style.display =
                    "block";

                memo.textContent =
                    trip.memo;

            } else if (memoSection) {

                memoSection.style.display =
                    "none";
            }
        }


        /* =========================================
         * ページ読み込み
         * ========================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const trip =
                    getSharedTrip();


                displaySharedTrip(
                    trip
                );

            }
        );

    </script>

</body>

</html>
