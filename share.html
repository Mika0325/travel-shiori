<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f09199">
    <meta name="description" content="共有された旅のしおりを確認できます。">
    <title>共有された旅のしおり</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>

<body class="share-page">

    <!-- ヘッダー -->
    <header class="app-header">
        <div class="header-inner">
            <a href="./index.html" class="header-back" aria-label="ホームへ戻る">
                ←
            </a>
            <h1>旅のしおり</h1>
        </div>
    </header>

    <main class="app-main share-main">

        <!-- 読み込み中 -->
        <div id="share-loading" class="share-message">
            <p>しおりを読み込んでいます……</p>
        </div>

        <!-- 読み込みエラー -->
        <div id="share-error" class="share-message share-error" hidden>
            <h2>しおりを表示できません</h2>
            <p>
                共有URLが正しくないか、
                共有データを読み込めませんでした。
            </p>
            <a href="./index.html" class="primary-button">
                ホームに戻る
            </a>
        </div>

        <!-- 共有されたしおり -->
        <div id="shared-trip-content" hidden>

            <!-- 旅行の基本情報 -->
            <section class="shared-trip-hero">
                <p class="shared-eyebrow">TRAVEL MEMORIES</p>

                <p id="shared-destination" class="shared-destination"></p>

                <h2 id="shared-title" class="shared-trip-title"></h2>

                <p id="shared-date" class="shared-trip-date"></p>

                <div class="shared-readonly-label">
                    共有されたしおり
                </div>
            </section>

            <!-- 日程 -->
            <section class="content-section shared-section">
                <div class="section-title">
                    <h2>旅の日程</h2>
                    <p>旅行の予定を確認しましょう</p>
                </div>

                <div id="shared-schedule-list" class="shared-schedule-list"></div>
            </section>

            <!-- 予算 -->
            <section class="content-section shared-section">
                <div class="section-title">
                    <h2>旅行の予算</h2>
                    <p>旅行にかかる費用のメモ</p>
                </div>

                <div id="shared-budget-list" class="shared-budget-list"></div>

                <div id="shared-budget-total" class="shared-budget-total"></div>
            </section>

            <!-- メモ -->
            <section id="shared-memo-section" class="content-section shared-section" hidden>
                <div class="section-title">
                    <h2>旅行メモ</h2>
                </div>

                <div id="shared-memo" class="shared-memo"></div>
            </section>

            <!-- 共有について -->
            <section class="share-info-card">
                <h2>このしおりについて</h2>
                <p>
                    このページは共有された旅のしおりです。
                </p>
                <p>
                    共有先では内容を編集できません。
                </p>

                <a href="./index.html" class="primary-button">
                    自分のしおりを作る
                </a>
            </section>

        </div>
    </main>

    <footer class="app-footer">
        <p>旅のしおり</p>
    </footer>

    <script>
        "use strict";

        // HTMLに表示する文字列を安全に変換
        function escapeHTML(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 共有URLからデータを取得
        function getSharedTrip() {
            const params = new URLSearchParams(
                window.location.search
            );

            const encodedData = params.get("data");

            if (!encodedData) {
                return null;
            }

            try {
                const base64 = encodedData
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");

                const padding =
                    "=".repeat((4 - base64.length % 4) % 4);

                const binary = atob(base64 + padding);

                const bytes = Uint8Array.from(
                    binary,
                    character => character.charCodeAt(0)
                );

                const json = new TextDecoder().decode(bytes);

                return JSON.parse(json);
            } catch (error) {
                console.error(
                    "共有データの読み込みに失敗しました。",
                    error
                );
                return null;
            }
        }

        // 日付を表示
        function formatDate(dateString) {
            if (!dateString) {
                return "";
            }

            const parts = String(dateString).split("-");

            if (parts.length !== 3) {
                return escapeHTML(dateString);
            }

            return `${escapeHTML(parts[0])}年${Number(parts[1])}月${Number(parts[2])}日`;
        }

        function formatDateRange(startDate, endDate) {
            if (!startDate && !endDate) {
                return "日程未設定";
            }

            if (startDate && endDate && startDate === endDate) {
                return formatDate(startDate);
            }

            if (startDate && endDate) {
                return `${formatDate(startDate)} ～ ${formatDate(endDate)}`;
            }

            return formatDate(startDate || endDate);
        }

        // 金額を表示
        function formatMoney(value) {
            const amount = Number(value);

            if (!Number.isFinite(amount)) {
                return "金額未設定";
            }

            return `${amount.toLocaleString("ja-JP")}円`;
        }

        // 配列以外の値を安全に空配列にする
        function asArray(value) {
            return Array.isArray(value) ? value : [];
        }

        // 旅行の基本情報を表示
        function displayTripInfo(trip) {
            document.getElementById("shared-title").textContent =
                trip.title || "タイトル未設定";

            document.getElementById("shared-destination").textContent =
                trip.destination || "旅行先未設定";

            document.getElementById("shared-date").textContent =
                formatDateRange(trip.startDate, trip.endDate);
        }

        // 日程を表示
        function displaySchedules(schedules) {
            const container = document.getElementById(
                "shared-schedule-list"
            );

            const typeIcons = {
                "出発": "🚩",
                "移動": "🚃",
                "観光": "📍",
                "食事": "🍴",
                "ホテル": "🏨",
                "その他": "📌"
            };

            if (schedules.length === 0) {
                container.innerHTML =
                    '<p class="empty-message">日程はまだ登録されていません。</p>';
                return;
            }

            container.innerHTML = schedules.map((schedule, index) => {
                const type = schedule.type || "その他";
                const icon = typeIcons[type] || "📌";

                const time = schedule.time || "";
                const place = schedule.place || schedule.name || "";
                const detail = schedule.detail || "";
                const memo = schedule.memo || "";

                return `
                    <article class="shared-schedule-card">
                        <div class="shared-schedule-number">
                            ${index + 1}
                        </div>

                        <div class="shared-schedule-body">
                            <div class="shared-schedule-type">
                                <span>${icon}</span>
                                <span>${escapeHTML(type)}</span>
                            </div>

                            ${time
                        ? `<p class="shared-schedule-time">${escapeHTML(time)}</p>`
                        : ""
                    }

                            ${place
                        ? `<h3 class="shared-schedule-place">${escapeHTML(place)}</h3>`
                        : ""
                    }

                            ${detail
                        ? `<p class="shared-schedule-detail">${escapeHTML(detail)}</p>`
                        : ""
                    }

                            ${memo
                        ? `<p class="shared-schedule-memo">${escapeHTML(memo)}</p>`
                        : ""
                    }
                        </div>
                    </article>
                `;
            }).join("");
        }

        // 予算を表示
        function displayBudgets(budgets) {
            const container = document.getElementById(
                "shared-budget-list"
            );

            const totalContainer = document.getElementById(
                "shared-budget-total"
            );

            if (budgets.length === 0) {
                container.innerHTML =
                    '<p class="empty-message">予算はまだ登録されていません。</p>';

                totalContainer.textContent = "合計：0円";
                return;
            }

            let total = 0;

            container.innerHTML = budgets.map(budget => {
                const category =
                    budget.category || budget.name || "その他";

                const amount = Number(budget.amount);
                const validAmount = Number.isFinite(amount) ? amount : 0;

                total += validAmount;

                return `
                    <div class="shared-budget-row">
                        <span class="shared-budget-category">
                            ${escapeHTML(category)}
                        </span>
                        <span class="shared-budget-amount">
                            ${formatMoney(validAmount)}
                        </span>
                    </div>
                `;
            }).join("");

            totalContainer.innerHTML = `
                <span>予算合計</span>
                <strong>${formatMoney(total)}</strong>
            `;
        }

        // メモを表示
        function displayMemo(memo) {
            const section = document.getElementById(
                "shared-memo-section"
            );

            const memoContainer = document.getElementById(
                "shared-memo"
            );

            if (!memo || !String(memo).trim()) {
                section.hidden = true;
                return;
            }

            section.hidden = false;
            memoContainer.textContent = String(memo);
        }

        // 画面全体を表示
        function displaySharedTrip() {
            const loading = document.getElementById("share-loading");
            const error = document.getElementById("share-error");
            const content = document.getElementById(
                "shared-trip-content"
            );

            const trip = getSharedTrip();

            loading.hidden = true;

            if (!trip || typeof trip !== "object") {
                error.hidden = false;
                content.hidden = true;
                return;
            }

            displayTripInfo(trip);
            displaySchedules(asArray(trip.schedules));
            displayBudgets(asArray(trip.budgets));
            displayMemo(trip.memo);

            error.hidden = true;
            content.hidden = false;
        }

        document.addEventListener(
            "DOMContentLoaded",
            displaySharedTrip
        );
    </script>
</body>

</html>
