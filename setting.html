<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>旅のしおり｜設定</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <h1>設定</h1>
        <p>旅のしおりの設定を変更できます</p>
    </header>


    <main class="main">

        <!-- アプリ設定 -->
        <section class="setting-section">

            <h2>アプリ設定</h2>

            <div class="setting-card">

                <div class="setting-item">
                    <div>
                        <h3>アプリ名</h3>
                        <p>旅のしおり</p>
                    </div>
                </div>

                <div class="setting-item">
                    <div>
                        <h3>バージョン</h3>
                        <p>1.0.0</p>
                    </div>
                </div>

            </div>

        </section>


        <!-- データ管理 -->
        <section class="setting-section">

            <h2>データ管理</h2>

            <div class="setting-card">

                <div class="setting-item setting-item-button">

                    <div>
                        <h3>旅行データを削除</h3>
                        <p>
                            保存されている旅行データをすべて削除します。
                        </p>
                    </div>

                    <button id="delete-all-data-button" class="delete-button">
                        削除
                    </button>

                </div>

            </div>

        </section>


        <!-- PWA -->
        <section class="setting-section">

            <h2>このアプリについて</h2>

            <div class="setting-card">

                <div class="setting-item">

                    <div>
                        <h3>旅のしおり</h3>
                        <p>
                            旅行の計画や予定をまとめて管理できるアプリです。
                        </p>
                    </div>

                </div>

            </div>

        </section>


        <!-- 注意書き -->
        <div class="setting-info">
            <p>
                ※旅行データはこの端末のブラウザに保存されています。
            </p>
            <p>
                ※ブラウザのデータを削除すると、旅行データも削除される場合があります。
            </p>
        </div>

    </main>


    <!-- 下部ナビゲーション -->
    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">
            <span>🏠</span>
            <small>ホーム</small>
        </a>

        <a href="travel.html" class="nav-item">
            <span>📖</span>
            <small>旅行</small>
        </a>

        <a href="favorite.html" class="nav-item">
            <span>⭐</span>
            <small>お気に入り</small>
        </a>

        <a href="setting.html" class="nav-item active">
            <span>⚙️</span>
            <small>設定</small>
        </a>

    </nav>


    <!-- JavaScript -->
    <script src="script.js"></script>


    <!-- PWA -->
    <script>
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker
                    .register("service-worker.js")
                    .then(function () {
                        console.log(
                            "Service Workerを登録しました。"
                        );
                    })
                    .catch(function (error) {
                        console.error(
                            "Service Workerの登録に失敗しました。",
                            error
                        );
                    });

            });

        }
    </script>

</body>

</html>
